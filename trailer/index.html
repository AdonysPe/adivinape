<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AdivinaPe · Trailer</title>
<link rel="icon" href="../public/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Rubik:wght@500;700;900&display=block" rel="stylesheet" />
<style>
  :root { --ink:#0b0b0f; --pink:#ff2e93; --yellow:#ffe600; --green:#00e676; --cyan:#00b8ff; --orange:#ff7a00; --violet:#b388ff; --mist:#d8d8e0 }
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden }
  #vp { position: fixed; inset: 0; display: grid; place-items: center }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); color: #fff; font-family: Rubik, system-ui, sans-serif; flex: none; transform-origin: center }
  #cam, #punch, #shake { position: absolute; inset: 0 }
  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden; overflow: hidden }
  .si { position: absolute; inset: 0 }
  .abs { position: absolute }
  .ctr { position: absolute; left: 50%; top: 50%; translate: -50% -50% }
  .d { font-family: Bungee, Impact, sans-serif; line-height: .9 }
  .sh { font-family: 'Bungee Shade', Bungee, sans-serif; line-height: .9 }
  .nw { white-space: nowrap }
  .dots { position: absolute; inset: -64px; background-image: radial-gradient(rgba(255,255,255,.075) 2.2px, transparent 2.8px); background-size: 32px 32px }
  .rays { position: absolute; left: 50%; top: 50%; width: 3600px; height: 3600px; translate: -50% -50%; border-radius: 50% }
  .glow { position: absolute; left: 50%; top: 50%; width: 1700px; height: 1700px; translate: -50% -50%; border-radius: 50% }
  .conf { position: absolute; width: 16px; height: 28px; opacity: 0 }
  .ring { position: absolute; width: 400px; height: 400px; margin: -200px 0 0 -200px; border-radius: 50%; border: 14px solid #fff; opacity: 0 }
  .chip { display: inline-block; font-family: Bungee, sans-serif; color: var(--ink); padding: 14px 22px 10px; line-height: 1 }
  .tag { position: absolute; font-family: Bungee, sans-serif; font-size: 34px; color: var(--ink); padding: 10px 18px 6px; rotate: -2deg }
  .hide { opacity: 0 }
  #flash, #fade { position: absolute; inset: 0; pointer-events: none; opacity: 0 }
  #flash { background: #fff }
  #fade { background: #000 }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.5)) }
  #play { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(11,11,15,.72); cursor: pointer; z-index: 10 }
  #play button { font-family: Bungee, sans-serif; font-size: clamp(22px, 4vw, 44px); background: var(--pink); color: #fff; border: 0; padding: .6em 1.1em .5em; box-shadow: 8px 8px 0 var(--yellow); cursor: pointer }
  body.render #play { display: none }
</style>
</head>
<body>
<div id="vp">
  <div id="stage">
    <div id="cam"><div id="punch"><div id="shake"></div></div></div>
    <div id="vig"></div>
    <div id="flash"></div>
    <div id="fade"></div>
  </div>
</div>
<div id="play"><button type="button">▶ VER TRAILER</button></div>

<script>
/* ================================================================
   AdivinaPe — trailer. Everything is a pure function of time:
   visuals are paused Web Animations seeked to t, and the music is
   synthesized with Web Audio on the same 128 BPM grid.
   ================================================================ */
const BPM = 128, B = 60 / BPM, T = (b) => b * B, END = 70, DUR = T(END);
const QS = new URLSearchParams(location.search);
const RENDER = QS.has('render');
if (RENDER) document.body.classList.add('render');
/** Vertical 9:16 (Reels, TikTok, Shorts) with ?v */
const V = QS.has('v'), W = V ? 1080 : 1920, H = V ? 1920 : 1080, CXs = W / 2, CYs = H / 2;
/** Pick the landscape or the vertical value. */
const L = (land, vert) => (V ? vert : land);
window.FORMAT = { W, H };

const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const camEl = document.getElementById('cam'), punchEl = document.getElementById('punch'), shakeEl = document.getElementById('shake');
const flashEl = document.getElementById('flash'), fadeEl = document.getElementById('fade');

const OUT = 'cubic-bezier(.16,1,.3,1)', BACK = 'cubic-bezier(.3,1.45,.5,1)', IN = 'cubic-bezier(.7,0,.84,0)', INOUT = 'cubic-bezier(.65,0,.35,1)';

const anims = [];
/** Animate `el` with keyframes starting at beat `at` for `dur` beats. */
function A(el, kf, at, dur, o = {}) {
  const a = el.animate(kf, { delay: T(at) * 1000, duration: Math.max(1, T(dur) * 1000), fill: o.fill || 'both', easing: o.ease || 'linear', iterations: o.it || 1 });
  a.pause();
  anims.push(a);
  return a;
}
function seek(t) { const ms = t * 1000; for (const a of anims) a.currentTime = ms }
window.seek = seek; window.DURATION = DUR;

function h(p, cls, css, html) {
  const e = document.createElement('div');
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (html != null) e.innerHTML = html;
  if (p) p.appendChild(e);
  return e;
}
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 } }
/** A scene visible between beats; returns its inner wrapper. */
function scene(from, to) {
  const s = h(shakeEl, 'scene');
  A(s, [{ opacity: 1, visibility: 'visible' }, { opacity: 1, visibility: 'visible' }], from, to - from, { fill: 'none' });
  return h(s, 'si');
}
/** Element shown only between beats (base opacity must be 0). */
function vis(el, from, to) { el.style.opacity = 0; A(el, [{ opacity: 1 }, { opacity: 1 }], from, to - from, { fill: 'none' }) }

/* ---------- FX ---------- */
function shake(at, amp = 26, len = .6) {
  const r = rng((at * 977) | 0), kf = [], n = 9;
  for (let i = 0; i <= n; i++) { const k = 1 - i / n; kf.push({ transform: `translate(${(r() * 2 - 1) * amp * k}px,${(r() * 2 - 1) * amp * k}px) rotate(${(r() * 2 - 1) * amp * .03 * k}deg)` }) }
  A(shakeEl, kf, at, len, { fill: 'none' });
}
function flash(at, color = '#fff', p = .9, len = .6) { A(flashEl, [{ opacity: p, backgroundColor: color }, { opacity: 0, backgroundColor: color }], at, len, { fill: 'none', ease: 'ease-out' }) }
function punch(at, s = 1.05, len = .5) { A(punchEl, [{ transform: `scale(${s})` }, { transform: 'scale(1)' }], at, len, { fill: 'none', ease: OUT }) }
function ringAt(p, at, color = '#fff', x = CXs, y = CYs, max = 4.5) {
  const r = h(p, 'ring', `left:${x}px;top:${y}px;border-color:${color}`);
  A(r, [{ opacity: 1, transform: 'scale(.15)' }, { opacity: 0, transform: `scale(${max})` }], at, 1.3, { fill: 'none', ease: OUT });
}
const CC = ['#ff2e93', '#ffe600', '#00e676', '#00b8ff', '#ff7a00', '#b388ff', '#ffffff'];
function burst(p, at, n, seed, x = CXs, y = CYs, power = 1) {
  const r = rng(seed), dur = 2.8, N = 20;
  for (let i = 0; i < n; i++) {
    const e = h(p, 'conf', `left:${x}px;top:${y}px;background:${CC[i % CC.length]};width:${10 + r() * 14}px;height:${16 + r() * 20}px${r() < .25 ? ';border-radius:50%' : ''}`);
    const ang = r() * Math.PI * 2, sp = (600 + r() * 1700) * power, vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp - 500 * power;
    const spin = (r() * 2 - 1) * 1500, d = 1.7, g = 1500, kf = [];
    for (let k = 0; k <= N; k++) {
      const s = (dur * k) / N, f = (1 - Math.exp(-d * s)) / d;
      kf.push({ transform: `translate(${vx * f}px,${vy * f + .5 * g * s * s}px) rotate(${spin * s}deg) rotateX(${spin * s * 1.4}deg)`, opacity: k / N > .7 ? 1 - (k / N - .7) / .3 : 1 });
    }
    A(e, kf, at, dur / B, { fill: 'none' });
  }
}
function rain(p, from, to, n, seed) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const e = h(p, 'conf', `left:${r() * W}px;top:0;background:${CC[i % CC.length]};width:${10 + r() * 12}px;height:${16 + r() * 18}px`);
    const dur = (2 + r() * 2.2) / B, sway = (r() * 2 - 1) * 140, spin = (r() * 2 - 1) * 900, kf = [];
    for (let k = 0; k <= 10; k++) { const u = k / 10; kf.push({ transform: `translate(${Math.sin(u * 6.28) * sway}px,${-80 + u * (H + 160)}px) rotate(${spin * u}deg) rotateY(${spin * u * 1.5}deg)`, opacity: 1 }) }
    A(e, kf, from - r() * dur, dur, { fill: 'none', it: Math.ceil((to - from) / dur) + 2 });
  }
}
function rays(p, c1, c2, n = 24, spinBeats = 64, dir = 1) {
  const step = 360 / n;
  const e = h(p, 'rays', `background:repeating-conic-gradient(from 0deg,${c1} 0deg ${step / 2}deg,${c2} ${step / 2}deg ${step}deg)`);
  A(e, [{ transform: 'rotate(0deg)' }, { transform: `rotate(${dir * 360}deg)` }], 0, spinBeats, { it: 4 });
  return e;
}
function glow(p, color, x = CXs, y = CYs, size = 1700) { return h(p, 'glow', `left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:radial-gradient(circle,${color},transparent 62%)`) }
function beatPulse(el, from, count, s = 1.1) { A(el, [{ transform: `scale(${s})`, opacity: 1 }, { transform: 'scale(1)', opacity: .65 }], from, 1, { it: count, fill: 'none', ease: 'ease-out' }) }
function band(p, y, rot, text, bg, fg, dir, from, to) {
  const b = h(p, 'abs', `left:-300px;width:2520px;top:${y}px;height:92px;background:${bg};rotate:${rot}deg;overflow:hidden;box-shadow:0 10px 0 rgba(0,0,0,.35)`);
  const tr = h(b, 'abs d nw', `left:0;top:18px;font-size:60px;color:${fg}`, (text + '&nbsp;').repeat(14));
  A(tr, [{ transform: `translateX(${dir > 0 ? -1400 : 0}px)` }, { transform: `translateX(${dir > 0 ? 0 : -1400}px)` }], from, to - from);
  return b;
}

const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%"><path d="M32 8a24 24 0 1 0 0 48a24 24 0 1 0 0-48z" fill="#FF2E93"/><path d="M32 8a24 24 0 0 1 24 24H32z" fill="#FFE600"/><path d="M32 32h24a24 24 0 0 1-24 24z" fill="#00E676"/><circle cx="32" cy="32" r="7" fill="#0B0B0F" stroke="#fff" stroke-width="3"/><path d="M32 2l-6 10h12z" fill="#fff"/></svg>`;
const NEON = 'color:#ff2e93;text-shadow:0 0 34px rgba(255,46,147,.85),12px 12px 0 #5a0b33';
const GRAD = 'background:linear-gradient(90deg,#ffe600,#ff7a00,#ff2e93);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(12px 12px 0 #3a2a00)';
function flicker(el, from, len) { A(el, [{ opacity: 1 }, { opacity: 1, offset: .18 }, { opacity: .5, offset: .2 }, { opacity: 1, offset: .22 }, { opacity: 1, offset: .6 }, { opacity: .55, offset: .62 }, { opacity: 1, offset: .64 }, { opacity: 1 }], from, len, { fill: 'none' }) }

/* ---------- Data (from src/data; render.mjs checks the totals) ---------- */
const CATS = [
  { id: 'celebridades', short: 'Famosos', name: 'Celebridades', tag: 'Estrellas', color: '#FF2E93', shadow: '#FFE600', n: '56 palabras', ex: 'Shakira, Messi, Cristiano Ronaldo' },
  { id: 'peliculas', short: 'Pelis', name: 'Películas', tag: 'Cine', color: '#FF7A00', shadow: '#00B8FF', n: '56 palabras', ex: 'Titanic, El Rey León, Harry Potter' },
  { id: 'series', short: 'Series', name: 'Series y TV', tag: 'Pantalla', color: '#00E676', shadow: '#FF2E93', n: '49 palabras', ex: 'Friends, Los Simpson, Stranger Things' },
  { id: 'musica', short: 'Música', name: 'Música y baile', tag: 'Con ritmo', color: '#FFE600', shadow: '#FF7A00', n: '195 cartas', ex: 'Latino y reguetón, Pop, Rock' },
  { id: 'personajes', short: 'Personajes', name: 'Personajes', tag: 'Íconos', color: '#00B8FF', shadow: '#00E676', n: '55 palabras', ex: 'Mickey Mouse, Batman, Superman' },
  { id: 'animales', short: 'Animales', name: 'Animales', tag: 'Salvaje', color: '#B388FF', shadow: '#FFE600', n: '52 palabras', ex: 'León, Elefante, Canguro' },
  { id: 'deportes', short: 'Deportes', name: 'Deportes', tag: 'A sudar', color: '#FF5C5C', shadow: '#00B8FF', n: '50 palabras', ex: 'Fútbol, Tenis, Natación' },
  { id: 'comida', short: 'Comida', name: 'Comida del mundo', tag: 'Con hambre', color: '#C6FF00', shadow: '#FF2E93', n: '50 palabras', ex: 'Pizza, Sushi, Hamburguesa' },
  { id: 'acciones', short: 'Acciones', name: 'Acciones', tag: 'Manos a la obra', color: '#FF80AB', shadow: '#00E676', n: '51 palabras', ex: 'Cepillarse los dientes, Pescar' },
  { id: 'lugares', short: 'Lugares', name: 'Lugares del mundo', tag: 'De viaje', color: '#40C4FF', shadow: '#FF7A00', n: '51 palabras', ex: 'Torre Eiffel, Machu Picchu' },
  { id: 'navidad', short: 'Navidad', name: 'Navidad', tag: 'Felices fiestas', color: '#F4F7FF', shadow: '#FF2E3E', n: '64 palabras', ex: 'Árbol de Navidad, Panetón, Villancicos' },
];
/** Counts from the posters above; render.mjs fails loudly if they drift from src/data/categories.json. */
const DATA_TOTALS = {
  categories: CATS.length,
  words: CATS.reduce((a, c) => a + Number(c.n.split(' ')[0]), 0),
  byId: Object.fromEntries(CATS.map((c) => [c.id, Number(c.n.split(' ')[0])])),
};
window.DATA_TOTALS = DATA_TOTALS;

/* ---------- Wheel physics (shared by picture and sound) ---------- */
const SEG = 360 / CATS.length; // 11 categories -> ~32.73deg per slice
const SPIN_FROM = 24.5, SPIN_TO = 30, SPIN_TOTAL = 360 - SEG / 2 + 360 * 5; // lands Celebridades under the pointer
function wheelAngle(b) {
  if (b <= 24) return 0;
  if (b < SPIN_FROM) { const u = (b - 24) / (SPIN_FROM - 24); return -22 * Math.sin(u * Math.PI / 2) ** 2 * (1 - u) * 2.2 }
  if (b >= SPIN_TO) return SPIN_TOTAL;
  const u = (b - SPIN_FROM) / (SPIN_TO - SPIN_FROM);
  return SPIN_TOTAL * (1 - Math.pow(1 - u, 3.2));
}
const WHEEL_TICKS = [];
{
  let last = -1;
  for (let k = 1; k * SEG <= SPIN_TOTAL; k++) {
    let lo = SPIN_FROM, hi = SPIN_TO;
    for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; wheelAngle(m) < k * SEG ? (lo = m) : (hi = m) }
    if (T(hi) - T(last) > .045 || last < 0) { WHEEL_TICKS.push(hi); last = hi }
  }
}

/* ================================================================
   SCENES
   ================================================================ */

/* S0 · Intro (0–4) */
{
  const s = scene(0, 4.1);
  h(s, 'dots');
  const IY = L(470, 820);
  const g = glow(s, 'rgba(255,46,147,.4)', CXs, IY);
  A(g, [{ opacity: 0, transform: 'scale(.3)' }, { opacity: 1, transform: 'scale(1)' }], 0, 3, { ease: OUT });
  const rw = h(s, 'abs', 'inset:0'); rays(rw, 'rgba(255,255,255,.04)', 'transparent', 28, 48);
  A(rw, [{ opacity: 0 }, { opacity: 1 }], 0, 2);
  for (let i = 0; i < 4; i++) ringAt(s, i, i % 2 ? '#ffe600' : '#ff2e93', CXs, IY, 3.2);
  const iw = h(s, 'ctr', `top:${IY}px;width:300px;height:300px`);
  const ic = h(iw, 'abs', 'inset:0;filter:drop-shadow(0 0 40px rgba(255,46,147,.7))', LOGO);
  A(ic, [{ transform: 'scale(0) rotate(-900deg)' }, { transform: 'scale(1) rotate(0deg)' }], 0, 3, { ease: OUT });
  beatPulse(iw, 1, 3, 1.08);
  const cap = h(s, 'ctr d nw', `top:${L(760, 1190)}px;font-size:${L(36, 40)}px;color:#d8d8e0;text-align:center;line-height:1.5`, L('UNA NUEVA FORMA DE JUGAR CHARADAS', 'UNA NUEVA FORMA<br>DE JUGAR CHARADAS'));
  A(cap, [{ opacity: 0, letterSpacing: '.9em', filter: 'blur(10px)' }, { opacity: 1, letterSpacing: '.25em', filter: 'blur(0)' }], 1, 2, { ease: OUT });
  A(s, [{ transform: 'scale(1)', filter: 'blur(0)', opacity: 1 }, { transform: 'scale(7)', filter: 'blur(12px)', opacity: 0 }], 3.55, .45, { fill: 'forwards', ease: IN });
}

/* S1 · ARMA / GIRA / ACTÚA / GANA (4–8) */
{
  const W = [['ARMA', '#ff2e93', '#fff', '#5a0b33'], ['GIRA', '#ffe600', '#0b0b0f', '#ff2e93'], ['ACTÚA', '#00e676', '#0b0b0f', '#00b8ff'], ['GANA', '#00b8ff', '#0b0b0f', '#ffe600']];
  W.forEach(([w, bg, fg, sh], i) => {
    const at = 4 + i, s = scene(at, 8.05);
    const p = h(s, 'abs', `inset:-60px;background:${bg}`);
    h(p, 'abs', 'inset:0;background:repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 44px,transparent 44px 88px)');
    A(p, [{ transform: `translateX(${i % 2 ? '-' : ''}115%) skewX(-14deg)` }, { transform: 'translateX(0) skewX(0deg)' }], at, .2, { ease: OUT });
    const num = h(s, 'abs d', `left:${L(90, 70)}px;top:${L(80, 150)}px;font-size:64px;color:${fg}`, `0${i + 1}<span style="font-size:28px;margin-left:14px;opacity:.75">/ 04</span>`);
    A(num, [{ transform: 'translateY(-120px)', opacity: 0 }, { transform: 'none', opacity: 1 }], at + .1, .3, { ease: OUT });
    const drift = h(s, 'ctr', `width:1px;height:1px;top:${L(560, 990)}px`);
    A(drift, [{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }], at, 1.2, { ease: 'ease-out' });
    const wd = h(drift, 'ctr d nw', `font-size:${L(380, 235)}px;color:${fg};text-shadow:${L(18, 12)}px ${L(18, 12)}px 0 ${sh}`, w);
    A(wd, [{ transform: `scale(2.8) rotate(${i % 2 ? 9 : -9}deg)`, opacity: 0, filter: 'blur(14px)' }, { opacity: 1, offset: .3 }, { transform: 'scale(1) rotate(0deg)', opacity: 1, filter: 'blur(0)' }], at, .32, { ease: BACK });
    shake(at, 22, .5); punch(at, 1.03);
    if (i === 3) {
      const r = rng(77);
      for (let k = 0; k < 6; k++) A(wd, [{ transform: `translate(${(r() * 2 - 1) * 60}px,${(r() * 2 - 1) * 30}px) skewX(${(r() * 2 - 1) * 20}deg)`, filter: `hue-rotate(${r() * 360}deg)` }, { transform: `translate(${(r() * 2 - 1) * 60}px,0) skewX(0deg)`, filter: 'none' }], 7.5 + k / 12, 1 / 12, { fill: 'none' });
    }
  });
}

/* S2 · Logo drop (8–16) */
{
  const s = scene(8, 16.1);
  const bw = h(s, 'abs', 'inset:0'); rays(bw, 'rgba(255,46,147,.18)', 'rgba(255,46,147,0)', 20, 32);
  h(s, 'dots');
  const g = glow(s, 'rgba(255,46,147,.5)', CXs, L(480, 860)); beatPulse(g, 8, 8, 1.12);
  const b1 = band(s, L(-26, 140), -2, 'ARMA · GIRA · ACTÚA · GANA ·', '#ffe600', '#0b0b0f', 1, 8, 16);
  const b2 = band(s, L(1000, 1700), -2.5, 'CHARADAS · CHARADAS · CHARADAS ·', '#00e676', '#0b0b0f', -1, 8, 16);
  A(b1, [{ transform: 'translateY(-160px)' }, { transform: 'none' }], 10, .5, { ease: OUT });
  A(b2, [{ transform: 'translateY(180px)' }, { transform: 'none' }], 10, .5, { ease: OUT });
  const logo = h(s, 'abs', 'inset:0');
  A(logo, [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-95px) scale(.84)' }], 11.5, .5, { ease: OUT });
  const l1 = h(logo, 'ctr d nw', `top:${L(400, 760)}px;font-size:${L(300, 205)}px;${NEON}`, 'ADIVINA');
  A(l1, [{ transform: 'translateY(-1100px) rotate(-14deg) scale(.7)' }, { transform: 'none' }], 8, .7, { ease: BACK });
  flicker(l1, 9, 6);
  const l2 = h(logo, 'ctr d nw', `top:${L(690, 990)}px;font-size:${L(350, 270)}px;${GRAD}`, 'PE!');
  A(l2, [{ transform: 'translateY(1000px) rotate(16deg) scale(.6)' }, { transform: 'rotate(-3deg)' }], 9, .7, { ease: BACK });
  const iw = h(logo, 'abs', L('left:1290px;top:575px;width:210px;height:210px', 'left:800px;top:930px;width:170px;height:170px'));
  A(iw, [{ transform: 'scale(0) rotate(-540deg)' }, { transform: 'scale(1) rotate(0deg)' }], 10, .75, { ease: BACK });
  const ic = h(iw, 'abs', 'inset:0', LOGO);
  A(ic, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], 10.75, 4, { it: 2 });
  const iw2 = h(logo, 'abs', L('left:420px;top:600px;width:150px;height:150px;rotate:-20deg', 'left:110px;top:960px;width:130px;height:130px;rotate:-20deg'));
  A(iw2, [{ transform: 'scale(0) rotate(540deg)' }, { transform: 'scale(1) rotate(0deg)' }], 10.5, .75, { ease: BACK });
  h(iw2, 'abs', 'inset:0;filter:hue-rotate(160deg)', LOGO);
  flash(8, '#fff', 1, .8); shake(8, 44, .9); punch(8, 1.08, .8);

    lfo.start(t); lfo.stop(t + d + .2);
  }
  // fx
  function impact(b, v = .9) {
    const t = tb(b), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(26, t + 1.4);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .004); g.gain.exponentialRampToValueAtTime(.001, t + 1.8);
    o.connect(g).connect(fx); o.start(t); o.stop(t + 1.9);
    send(nz(t, 1.2, 'lowpass', 1500, v * .5, fx, .6), .6);
  }
  function riser(b, len, v = .3) {
    const t = tb(b), d = T(len);
    const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2.5; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(9000, t + d);
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + d * .98); g.gain.linearRampToValueAtTime(0, t + d + .02);
    s.connect(f).connect(g).connect(fx); send(g, .3); s.start(t); s.stop(t + d + .05);
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, t + d);
    const og = ctx.createGain(); og.gain.setValueAtTime(.0001, t); og.gain.exponentialRampToValueAtTime(v * .16, t + d * .98); og.gain.linearRampToValueAtTime(0, t + d + .02);
    const ol = ctx.createBiquadFilter(); ol.type = 'lowpass'; ol.frequency.value = 3000; o.connect(ol).connect(og).connect(fx); o.start(t); o.stop(t + d + .05);
  }
  function whoosh(b, v = .28, len = .6) {
    const d = T(len), t = tb(b) - d * .7;
    const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.3; f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(5000, t + d * .7); f.frequency.exponentialRampToValueAtTime(1200, t + d);
    const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f).connect(g).connect(fx); send(g, .2); s.start(t, Math.random()); s.stop(t + d + .05);
  }
  const tick = (t, v = .1) => { tone(t, 'square', 2600, .02, v, fx, { a: .001 }); nz(t, .012, 'highpass', 4000, v * .6, fx) };
  const pop = (b, m, v = .2) => { const t = tb(b), o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(mtof(m) * 2, t); o.frequency.exponentialRampToValueAtTime(mtof(m), t + .05); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .002); g.gain.exponentialRampToValueAtTime(.001, t + .16); o.connect(g).connect(fx); send(g, .15); o.start(t); o.stop(t + .2) };
  const ding = (b, v = .15) => { const t = tb(b); [[88, 0], [93, .075]].forEach(([m, dt]) => { send(tone(t + dt, 'sine', mtof(m), .55, v, fx, { a: .002 }), .3, .2); tone(t + dt, 'triangle', mtof(m) * 2, .15, v * .25, fx, { a: .002 }) }) };
  const buzz = (b, v = .12) => { for (const f of [98, 104]) tone(tb(b), 'sawtooth', f, .24, v, fx, { a: .005, lp: 1100 }) };
  const rattle = (b, len, v = .12) => { for (let i = 0; i < 10; i++) nz(tb(b) + (T(len) * i) / 10, .03, 'bandpass', 2400 + i * 150, v * (1 - i / 14), fx, 2) };
  const swell = (b, len, v = .22) => { const t = tb(b), d = T(len); const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3000; const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + d); g.gain.linearRampToValueAtTime(0, t + d + .01); s.connect(f).connect(g).connect(fx); s.start(t); s.stop(t + d + .05) };

  /* ---- arrangement ---- */
  const CH = { Am: [57, 60, 64], F: [57, 60, 65], C: [55, 60, 64], G: [55, 59, 62] };
  const RT = { Am: 33, F: 29, C: 36, G: 31 };
  const PROG = ['Am', 'F', 'C', 'G'], chordAt = (bar) => (bar < 2 ? 'Am' : PROG[(bar - 2) % 4]);
  const HOOK = [[0, 76, .5], [.75, 76, .25], [1.5, 74, .5], [2, 72, .5], [3, 69, .75], [4, 72, .5], [4.75, 72, .25], [5.5, 74, .5], [6, 76, 1], [7, 72, .5],
    [8, 79, .5], [8.75, 79, .25], [9.5, 76, .5], [10, 74, .5], [11, 72, .75], [12, 74, .5], [12.75, 74, .25], [13.5, 76, .5], [14, 71, 1.5]];
  const ARP = [0, 1, 2, 3, 2, 1, 3, 2, 0, 2, 1, 3, 2, 3, 1, 2];
  const hook = (at, from, to, v = .1, oct = 0) => HOOK.filter(([o]) => o >= from && o < to).forEach(([o, m, l]) => lead(at + o - from, m + oct, l, v));
  const arp = (bar, v = .06, upto = 4) => { const c = CH[chordAt(bar)], tones = [c[0] + 12, c[1] + 12, c[2] + 12, c[0] + 24]; ARP.forEach((ix, k) => { if (k / 4 < upto) pluck(bar * 4 + k / 4, tones[ix], v, .4) }) };
  function groove(bar, o = {}) {
    const b0 = bar * 4, ch = chordAt(bar), upto = o.upto ?? 4;
    for (let i = 0; i < upto; i++) { kick(b0 + i); hat(b0 + i + .5, .15, true); if (i === 1 || i === 3) clap(b0 + i) }
    for (let k = 0; k < upto * 4; k++) shaker(b0 + k / 4, k % 4 === 2 ? .085 : .045);
    [[.75, 64], [1.5, 69], [2.75, 64], [3.5, 71]].forEach(([oo, m]) => { if (oo < upto) conga(b0 + oo, m - 12, .16) });
    [[.5, 0], [1.5, 12], [2.5, 0], [3.25, 0], [3.5, 12]].forEach(([oo, dm]) => { if (oo < upto) bass(b0 + oo, RT[ch] + 12 + dm, oo === 3.25 ? .22 : .42) });
    if (o.stabs !== false) [0, .75, 1.5].forEach((oo) => stab(b0 + oo, CH[ch].map((n) => n + 12), .45, .065, 3600));
    pad(b0, CH[ch], Math.min(4, upto + .5), .045);
    if (o.arp) arp(bar, .055, upto);
  }

  // bar 0 — intro
  impact(0, .55); pad(0, CH.Am.concat(69), 4, .09, 900); riser(0, 4, .22); swell(2, 2, .2);
  for (let k = 0; k < 4; k++) hat(2 + k * .5, .05 + k * .015);
  [0, 1, 2, 3].forEach((i) => pop(i, 69 + i * 3, .12));
  for (let k = 0; k < 8; k++) pluck(2 + k * .25, CH.Am[k % 3] + 24, .03 + k * .006, .35);
  // bar 1 — ARMA GIRA ACTÚA GANA
  PROG.forEach((c, i) => { const b = 4 + i; kick(b); stab(b, CH[c].concat(CH[c][0] + 12, CH[c][2] + 12), .9, .19, 7000, .35, .15); bass(b, RT[c] + 12, .9, .42); crash(b, .14); clap(b, .35) });
  for (let k = 0; k < 8; k++) snare(7 + k / 8, .16 + k * .055);
  riser(6, 2, .32);
  // bars 2–5 — drop + hook
  impact(8); crash(8, .3); [2, 3, 4, 5].forEach((bar) => groove(bar)); hook(8, 0, 16);
  snare(9, .45); crash(9, .14);
  [0, 1, 2, 3, 4].forEach((i) => pop(12 + i * .5, 72 + [0, 2, 4, 5, 7][i], .14));
  whoosh(16, .3); crash(16, .2);
  rattle(16, .5, .14); [0, 1, 2, 3, 4, 5].forEach((i) => pop(17 + i * .5, 64 + [0, 3, 5, 7, 10, 12][i], .18));
  rattle(20, .45, .14); for (let k = 0; k < 8; k++) tick(tb(20 + k * .25), .09);
  pop(22, 88, .22); snare(22, .4); crash(22, .14); snare(23, .4);
  whoosh(24, .3); crash(24, .2);
  // bars 6–7 — wheel
  groove(6, { arp: true, stabs: false }); groove(7, { arp: true, stabs: false });
  WHEEL_TICKS.forEach((b) => tick(tb(b), .085));
  impact(30, .75); crash(30, .28); stab(30, CH.F.concat(72, 77), 1.4, .16, 6500, .4, .2); ding(30.02, .1);
  for (let k = 0; k < 8; k++) snare(31 + k / 8, .12 + k * .04);
  whoosh(32, .3); crash(32, .22);
  // bars 8–9 — act
  groove(8, { arp: true }); groove(9, { arp: true });
  [true, true, false, true].forEach((ok, i) => { const at = 32 + i * 2; ok ? ding(at + 1.25) : buzz(at + 1.25); whoosh(at + 1.75, .22, .45) });
  // bars 10–11 — categories
  crash(40, .24); groove(10); groove(11); hook(40, 0, 8);
  for (let k = 0; k < L(12, 16); k++) pop(40 + k * L(.25, .2), 64 + [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24, 27, 29, 31, 34, 36][k], .11);
  [0, 1, 2, 3].forEach((i) => { pop(44 + i, 76 + i * 2, .16); crash(44 + i, .08) });
  for (let k = 0; k < 7; k++) tick(tb(45 + k * .12), .07);
  whoosh(48, .3);
  // bar 12 — podium
  groove(12, { stabs: false }); crash(48, .22);
  [[48, [55, 60, 64, 67]], [49, [57, 60, 64, 69]], [50, [59, 62, 67, 71]]].forEach(([b, n]) => { stab(b, n, .9, .17, 6500, .35, .15); snare(b, .3) });
  impact(51, .7); crash(51, .3); stab(51, [60, 64, 67, 72], 1, .16, 7000, .4, .2);
  // bar 13 — breakdown
  pad(52, [55, 59, 62, 67], 4, .1, 2200); riser(52, 4, .4); arp(13, .045);
  for (let k = 0; k < 4; k++) snare(52 + k * .5, .1 + k * .02);
  for (let k = 0; k < 4; k++) snare(54 + k * .25, .18 + k * .03);
  for (let k = 0; k < 8; k++) snare(55 + k / 8, .26 + k * .05);
  // bars 14–15 — finale
  impact(56, 1); crash(56, .32); groove(14); groove(15, { upto: 2 }); hook(56, 0, 6); hook(56, 0, 6, .045, 12);
  [[62, 'F'], [63, 'G'], [63.5, 'G'], [63.75, 'G']].forEach(([b, c], i) => { kick(b); stab(b, CH[c].concat(CH[c][0] + 12, CH[c][2] + 12), i < 2 ? .9 : .22, .19, 7000, .3, .1); bass(b, RT[c] + 12, i < 2 ? .9 : .22, .42); if (i > 1) snare(b, .4); crash(b, .1) });
  // final hit
  kick(64, 1.1); impact(64, 1); crash(64, .36); stab(64, [57, 60, 64, 69, 72, 76], 6, .2, 7000, .6, .25); bass(64, 45, 3, .45); pad(64, [57, 64, 69], 5, .08, 2000); ding(64.5, .07);

  // sidechain pump
  kicks.sort((a, b) => a - b);
  for (const k of kicks) { pump.gain.setValueAtTime(.38, k); pump.gain.linearRampToValueAtTime(1, k + T(.42)) }
  // filter sweeps
  mlp.frequency.setValueAtTime(380, t0); mlp.frequency.exponentialRampToValueAtTime(4000, tb(3.9)); mlp.frequency.setValueAtTime(18000, tb(4));
  mlp.frequency.setValueAtTime(18000, tb(51.9)); mlp.frequency.setValueAtTime(650, tb(52)); mlp.frequency.exponentialRampToValueAtTime(16000, tb(55.95)); mlp.frequency.setValueAtTime(18000, tb(56));
}

/* ---------- offline render → WAV (used by the MP4 renderer) ---------- */
window.renderAudio = async function () {
  const sr = 48000, len = Math.ceil((DUR + .5) * sr);
  const ctx = new OfflineAudioContext(2, len, sr);
  makeMusic(ctx, ctx.destination, 0);
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = buf.length;
  const out = new DataView(new ArrayBuffer(44 + n * 4));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)) };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVE'); w(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 4, true);
  let peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const gain = peak > .98 ? .98 / peak : 1;
  for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * gain)) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * gain)) * 32767, true) }
  const bytes = new Uint8Array(out.buffer); let s = '';
  for (let i = 0; i < bytes.length; i += 32768) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
  return { b64: btoa(s), peak };
};

/* ---------- live playback ---------- */
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${k})` }
if (!RENDER) {
  addEventListener('resize', fit); fit();
  seek(T(60.6));
  const play = document.getElementById('play'), btn = play.querySelector('button');
  let ctx = null;
  play.addEventListener('click', () => {
    if (ctx) ctx.close();
    ctx = new AudioContext(); play.style.display = 'none';
    const t0 = ctx.currentTime + .2; makeMusic(ctx, ctx.destination, t0);
    const me = ctx;
    const loop = () => {
      if (me !== ctx) return;
      const t = me.currentTime - t0 - (me.outputLatency || 0);
      seek(Math.max(0, t));
      if (t < DUR) requestAnimationFrame(loop);
      else { btn.textContent = '↻ VER DE NUEVO'; play.style.display = '' }
    };
    loop();
  });
}
window.READY = document.fonts.ready.then(() => Promise.all(['Bungee', 'Bungee Shade', 'Rubik'].map((f) => document.fonts.load(`64px "${f}"`)))).then(() => true);
</script>
